# LE LABS back-office — PROD nginx: serve the SPA + same-origin Supabase proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    # Same-origin Supabase proxy: the Supabase path prefixes are forwarded
    # (path preserved) to the API gateway. supabase-js builds these off the
    # origin, so they must be served from the app root.
    location ~ ^/(auth|rest|storage)/v1/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
